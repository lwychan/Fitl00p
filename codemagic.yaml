# Codemagic build config for the FitLoop iOS (Capacitor) wrapper.
#
# Before this can run a build, you need to (see CHECKLIST.md for the full list):
#   1. Sign up for Codemagic yourself and connect this GitHub repo
#      (lwychan/Fitl00p) to it.
#   2. In Codemagic's Team settings > Integrations > Apple Developer Portal,
#      add an App Store Connect API key with the **Admin** role (App
#      Manager isn't enough — creating certificates/profiles via the API
#      needs Admin access). Whatever name you give it there must match
#      `app_store_connect: codemagic-admin` under `integrations` below —
#      rename one side or the other if you pick a different name.
#   3. Register the com.lwychan.fitl00p App ID in the Apple Developer
#      Portal with HealthKit + Push Notifications capabilities enabled,
#      and create the app record in App Store Connect.
#   4. Once the app exists in App Store Connect, fill in its numeric Apple
#      ID below (App Store Connect > App Information > Apple ID) — the
#      build-number step works without it for a first build (falls back
#      to build 1), but later builds need it to avoid duplicate build
#      numbers.
#
# This project uses Swift Package Manager, not CocoaPods (Capacitor 8's
# default) — there's no ios/App/App.xcworkspace to build, so this targets
# the .xcodeproj directly and there's no `pod install` step.
#
# No `triggering:` block is set on purpose — builds only run when you
# start them manually from the Codemagic dashboard, so nothing eats into
# the free tier's monthly build minutes on every push. Add one later
# (e.g. on git tags) once you're ready for that.

workflows:
  ios-testflight:
    name: FitLoop iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Must be an Admin-role key, not App Manager — creating certificates
      # and provisioning profiles via the API (the "Fetch signing files"
      # step below) requires Admin access on Apple's side.
      app_store_connect: codemagic-admin
    environment:
      groups:
        # CERTIFICATE_PRIVATE_KEY (secret) — the CLI's "Fetch signing
        # files" step needs its own private key to create/save a
        # certificate; it doesn't generate one on its own even with
        # --create. Set in Codemagic's Environment variables tab, not
        # committed here.
        - ios_signing
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6811922097
        BUNDLE_ID: com.lwychan.fitl00p
        # Node 22 only loads capacitor.config.ts natively with this flag
        # (Node 23.6+ does it unflagged, but 23.x isn't an LTS release).
        NODE_OPTIONS: --experimental-strip-types
      node: 22.11.0
      xcode: latest

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Sync Capacitor (copies src/ into the iOS project, updates Package.swift)
        script: npx cap sync ios

      # No `environment.ios_signing` block on purpose — that's Codemagic's
      # UI-managed signing path (Code Signing Identities), which needs a
      # provisioning profile pre-uploaded there. Mixing it with the CLI
      # flow below causes "No matching profiles found" even once a
      # certificate exists. These 4 steps are the CLI-only path: they
      # fetch (or, on a brand-new bundle ID, create) both the certificate
      # and the App Store distribution profile via the App Store Connect
      # API key at build time.
      - name: Set up keychain for code signing
        script: keychain initialize

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST_BUILD_NUMBER + 1))

      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
